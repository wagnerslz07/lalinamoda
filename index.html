<script>
  let APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDgcbPcnlibvxdMu3aWKxn2fViMF037A1T1_b1-LqA-XYGYpjauRifGLsgRXTPAX2_/exec';
  let products = [];

  function getAdminPassword() {
    return localStorage.getItem('lalina_admin_pass') || '1234';
  }

  // Função para excluir produto do Google Sheets
  function deletarProduto(nomeProduto) {
    if (confirm('Tem certeza que deseja excluir o produto: ' + nomeProduto + '?')) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ acao: 'deletar', nome: nomeProduto })
      }).then(() => {
        alert('Produto excluído com sucesso!');
        location.reload();
      }).catch(err => alert('Erro ao excluir: ' + err));
    }
  }

  // Função que renderiza os produtos na aba "Produtos" do painel com o botão excluir
  function renderAdminProducts() {
    const container = document.getElementById('admin-products-container') || document.getElementById('products-list-admin');
    if (!container) return;
    
    container.innerHTML = '';
    products.forEach(p => {
      container.innerHTML += `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px; border-bottom:1px solid #ddd;">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${p.foto || p.imagem || 'https://via.placeholder.com/50'}" width="50" height="50" style="object-fit:cover; border-radius:4px;">
            <div>
              <strong>${p.nome}</strong><br>
              <small>R$ ${parseFloat(p.preco || 0).toFixed(2)}</small>
            </div>
          </div>
          <button onclick="deletarProduto('${p.nome}')" style="background:#d9534f; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">
            Excluir
          </button>
        </div>
      `;
    });
  }
</script>
